name: Materialize Qeyvo PRD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qeyvo-prd-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Qeyvo PRD files
        shell: bash
        run: |
          set -euo pipefail
          bundle='docs/product/qeyvo/_bundle'
          for name in MASTER_PRD.md MASTER_PRD.html REQUIREMENTS.json; do
            cat "$bundle/$name.bz2.b64.part"* | base64 --decode | bunzip2 > "docs/product/qeyvo/$name"
          done
          python -m json.tool docs/product/qeyvo/REQUIREMENTS.json >/dev/null
          rm -rf "$bundle"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/product/qeyvo
          git diff --cached --quiet && exit 0
          git commit -m 'docs: add Qeyvo product requirements package'
          git push

# Triggered after the workflow existed on the default branch.
