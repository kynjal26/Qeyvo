name: Materialize Qeyvo PRD

on:
  push:
    branches: [main]
    paths:
      - 'docs/product/qeyvo/_bundle/REQUIREMENTS.json.bz2.b64.part001'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize PRD package
        shell: bash
        run: |
          set -euo pipefail
          bundle='docs/product/qeyvo/_bundle'
          for name in MASTER_PRD.md MASTER_PRD.html REQUIREMENTS.json; do
            cat "$bundle/$name.bz2.b64.part"* | base64 --decode | bunzip2 > "docs/product/qeyvo/$name"
          done
          python -m json.tool docs/product/qeyvo/REQUIREMENTS.json >/dev/null
          if grep -R -F 'Ebenezer Collins' docs/product/qeyvo/ --exclude-dir=_bundle; then
            echo 'Personal metadata detected; refusing to publish.' >&2
            exit 1
          fi
          rm -rf "$bundle"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/product/qeyvo
          git diff --cached --quiet && exit 0
          git commit -m 'docs: add Qeyvo product requirements package'
          git push
